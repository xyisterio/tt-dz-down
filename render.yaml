services:
  # У Render нет бесплатного плана для type: worker (только Web Service,
  # Static Site, Postgres, Redis). Поэтому деплоим как web — бот сам
  # поднимает health-check сервер на $PORT (см. index.js), а работает
  # как обычно через long polling, вебхук не нужен.
  - type: web
    name: tiktok-relay-bot
    env: docker
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: DEEZER_API_URL
        sync: false
      - key: DEEZER_ARL
        sync: false
      - key: DEEZER_FORMAT
        sync: false
      - key: DEEZER_PROXY
        sync: false
      - key: DEBUG_PROXY_KEY
        sync: false
